<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elementas — The Periodic Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />

<!-- Import map: lets atom.js "import * as THREE from 'three'" without a bundler -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1>Elementas - The Periodic table</h1>
    <p class="subtitle">Tap any tile for its data and a 3D model of the atom.</p>
  </div>
  <div class="controls">
    <div class="controls-row">
      <input type="search" id="search-input" placeholder="Search by name, symbol, or number" autocomplete="off" />
      <div class="settings-wrap">
        <button type="button" id="settings-toggle" class="settings-toggle" aria-label="Display settings" aria-expanded="false">⚙ Units</button>
        <div class="settings-panel hidden" id="settings-panel">
          <fieldset>
            <legend>Temperature</legend>
            <label><input type="radio" name="temp-unit" value="C" /> °C</label>
            <label><input type="radio" name="temp-unit" value="K" /> K</label>
            <label><input type="radio" name="temp-unit" value="F" /> °F</label>
          </fieldset>
          <fieldset>
            <legend>Mass precision</legend>
            <label><input type="radio" name="mass-precision" value="compact" /> Compact (2 dp)</label>
            <label><input type="radio" name="mass-precision" value="full" /> Full</label>
          </fieldset>
        </div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</header>

<main>
  <div class="grid-scroll">
    <div class="periodic-grid" id="periodic-grid"></div>
  </div>
  <p class="scroll-hint">Table is wider than your screen on mobile — scroll sideways to see every group.</p>
</main>

<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <button class="modal-close" id="modal-close" aria-label="Close element details">×</button>

    <div class="modal-header">
      <div class="modal-tile" id="modal-tile">
        <span class="modal-tile-number" id="modal-number"></span>
        <span class="modal-tile-symbol" id="modal-symbol"></span>
        <span class="modal-tile-mass" id="modal-mass"></span>
      </div>
      <div class="modal-titles">
        <h2 id="modal-name"></h2>
        <p class="modal-category" id="modal-category"></p>
      </div>
    </div>

    <div class="modal-body">
      <div class="atom-viewer">
        <div id="atom-viewer" class="atom-canvas-host"></div>
        <div class="atom-controls">
          <button type="button" id="atom-play-pause" aria-label="Pause animation">⏸</button>
          <label class="atom-speed-label">
            Speed
            <input type="range" id="atom-speed" min="0" max="2" step="0.1" value="1" />
          </label>
          <button type="button" id="atom-reset-view">Reset view</button>
        </div>
        <p class="atom-hint">Drag to rotate, scroll to zoom</p>
      </div>

      <div class="modal-data">
        <p class="modal-summary" id="modal-summary"></p>

        <div class="particle-row" id="particle-row"></div>

        <div class="modal-tabs" id="modal-tabs" role="tablist">
          <button type="button" class="modal-tab active" data-tab="properties" role="tab">Properties</button>
          <button type="button" class="modal-tab" data-tab="isotopes" role="tab">Isotopes</button>
          <button type="button" class="modal-tab" data-tab="uses" role="tab">Uses</button>
        </div>

        <div class="tab-panel" id="tab-properties">
          <div class="ion-row" id="ion-row"></div>
          <dl class="modal-stats" id="modal-stats"></dl>
        </div>
        <div class="tab-panel hidden" id="tab-isotopes">
          <div id="isotope-list"></div>
        </div>
        <div class="tab-panel hidden" id="tab-uses">
          <p id="uses-text"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script type="module">
// atom.js — 3D atom viewer built with Three.js
// Exposes window.AtomViewer.{render, dispose, toggleAnimation, setSpeed, resetView}

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let state = null; // holds the currently-mounted scene so we can tear it down cleanly

function dispose() {
  if (!state) return;
  cancelAnimationFrame(state.frameId);
  state.resizeObserver.disconnect();
  state.controls.dispose();
  state.scene.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach((m) => m.dispose());
    }
  });
  state.renderer.dispose();
  if (state.renderer.domElement.parentNode) {
    state.renderer.domElement.parentNode.removeChild(state.renderer.domElement);
  }
  state = null;
}

function render(container, elementData, colorHex) {
  dispose();
  container.innerHTML = "";

  const width = container.clientWidth || 320;
  const height = container.clientHeight || width;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;

  const accent = new THREE.Color(colorHex || "#4ea1f2");

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.PointLight(0xffffff, 1.3);
  key.position.set(6, 5, 8);
  scene.add(key);
  const fill = new THREE.PointLight(accent, 0.6);
  fill.position.set(-6, -3, -6);
  scene.add(fill);

  // --- nucleus: size grows gently with atomic number ---
  const nucleusRadius = 0.55 + Math.min(elementData.number, 118) / 118 * 0.4;
  const nucleus = new THREE.Mesh(
    new THREE.SphereGeometry(nucleusRadius, 32, 32),
    new THREE.MeshStandardMaterial({
      color: accent,
      emissive: accent,
      emissiveIntensity: 0.4,
      roughness: 0.35,
      metalness: 0.25,
    })
  );
  scene.add(nucleus);

  // --- electron shells: one tilted ring + orbiting electrons per shell ---
  const shells = elementData.shells && elementData.shells.length ? elementData.shells : [1];
  const baseRadius = nucleusRadius + 0.9;
  const shellGap = 0.62;
  const ringMat = new THREE.LineBasicMaterial({ color: accent, transparent: true, opacity: 0.32 });
  const electronGeo = new THREE.SphereGeometry(0.095, 16, 16);
  const electronMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: accent,
    emissiveIntensity: 0.7,
    roughness: 0.2,
  });

  const shellGroup = new THREE.Group();
  scene.add(shellGroup);

  const shellObjs = shells.map((count, i) => {
    const radius = baseRadius + i * shellGap;
    const curvePoints = new THREE.EllipseCurve(0, 0, radius, radius, 0, Math.PI * 2, false, 0)
      .getPoints(96)
      .map((p) => new THREE.Vector3(p.x, p.y, 0));
    const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(curvePoints), ringMat);

    const pivot = new THREE.Group();
    const tiltX = (i * 0.55) % Math.PI;
    const tiltZ = (i * 0.37) % Math.PI;
    pivot.rotation.set(tiltX, 0, tiltZ);
    ring.rotation.set(tiltX, 0, tiltZ);
    shellGroup.add(ring);
    shellGroup.add(pivot);

    const electrons = [];
    for (let k = 0; k < count; k++) {
      const angle = (Math.PI * 2 * k) / count;
      const mesh = new THREE.Mesh(electronGeo, electronMat);
      pivot.add(mesh);
      electrons.push({ mesh, angle });
    }

    return { radius, electrons, baseSpeed: 0.55 / (i + 1) };
  });

  const outerRadius = baseRadius + (shells.length - 1) * shellGap;
  const camDist = Math.min(Math.max(outerRadius * 2.15, 4.5), 22);
  camera.position.set(0, camDist * 0.25, camDist);
  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  controls.minDistance = camDist * 0.35;
  controls.maxDistance = camDist * 2.2;
  controls.update();
  controls.saveState(); // so resetView() returns to this framing, not Three.js defaults

  function animate() {
    state.frameId = requestAnimationFrame(animate);
    if (state.playing) {
      nucleus.rotation.y += 0.003 * state.speed;
      shellObjs.forEach((s) => {
        s.electrons.forEach((e) => {
          e.angle += s.baseSpeed * 0.02 * state.speed;
          e.mesh.position.set(Math.cos(e.angle) * s.radius, Math.sin(e.angle) * s.radius, 0);
        });
      });
    }
    controls.update();
    renderer.render(scene, camera);
  }

  const resizeObserver = new ResizeObserver((entries) => {
    const { width: w, height: h } = entries[0].contentRect;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
  resizeObserver.observe(container);

  state = { renderer, scene, camera, controls, frameId: 0, resizeObserver, playing: true, speed: 1 };
  animate();
}

function toggleAnimation() {
  if (!state) return true;
  state.playing = !state.playing;
  state.controls.autoRotate = state.playing;
  return state.playing;
}

function setSpeed(multiplier) {
  if (!state) return;
  state.speed = multiplier;
}

function resetView() {
  if (!state) return;
  state.controls.reset();
}

window.AtomViewer = { render, dispose, toggleAnimation, setSpeed, resetView };

</script>
<script src="app.js" defer></script>
</body>
</html>
